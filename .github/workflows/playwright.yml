name: Arkon E2E Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    name: Playwright E2E
    runs-on: ubuntu-latest
    # 45 (was 30): headroom so the report artifact still uploads on a bad run
    # instead of the job dying mid-suite with no diagnostics.
    timeout-minutes: 45

    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: arkon
          POSTGRES_PASSWORD: arkon
          POSTGRES_DB: arkon
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://arkon:arkon@localhost:5432/arkon
      MC_ADMIN_TOKEN: test-admin-token-ci
      MC_AGENT_TOKENS: default:test-agent-token
      ARKON_BASE_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-nextauth-secret-32chars-minimum
      NEXTAUTH_URL: http://localhost:3000
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          ARKON_NPM_TOKEN: ${{ secrets.ARKON_NPM_TOKEN }}

      - name: Run database migrations
        run: npx tsx scripts/migrate.ts

      - name: Seed E2E fixture data
        run: npx tsx scripts/seed-e2e.ts
        env:
          ARKON_SEED_E2E: '1'

      - name: Build Arkon
        run: npm run build

      - name: Start Arkon server
        run: npm start &
        env:
          PORT: 3000

      - name: Wait for server to be ready
        run: npx wait-on http://localhost:3000/api/health --timeout 30000

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests
        run: npx playwright test --project=chromium-desktop
        env:
          MC_ADMIN_TOKEN: test-admin-token-ci
          MC_AGENT_TOKENS: default:test-agent-token
          ARKON_BASE_URL: http://localhost:3000

      - name: Upload test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
