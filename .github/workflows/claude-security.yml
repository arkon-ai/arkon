name: Claude Security Review

# Layer 3 of the 3-layer security model (real-time security-guidance plugin ->
# local /security-review -> this CI gate). Dedicated security-only pass on every
# PR. $0 — OAuth subscription token, no metered API key.
# Actions SHA-pinned (supply-chain hardening); Dependabot keeps them current.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: claude-security-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@787c5a0ce96a9a6cfb050ea0c8f4c05f2447c251 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "*"
          track_progress: true
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}

            You are a SECURITY-ONLY reviewer. Ignore style, naming,
            formatting, and general code-quality nits — the separate
            Claude Code Review handles those. Review the PR diff strictly
            for exploitable security vulnerabilities, OWASP-aligned:

            - Injection: SQL, command, template, LDAP, header, log
            - Broken auth / session handling; missing or wrong authz checks
            - IDOR / missing tenant scoping (cross-tenant data leakage)
            - SSRF, unsafe outbound requests, open redirects
            - Hardcoded secrets, tokens, credentials, private keys in code
            - Unsafe deserialization (pickle, eval, new Function, YAML load)
            - Dangerous shell/exec: child_process.exec, os.system, backticks
            - XSS: dangerouslySetInnerHTML, innerHTML, unescaped template output
            - Prototype pollution, mass assignment / unsafe object merge
            - ReDoS: catastrophic regex backtracking on user-controlled input
            - JWT/secret mishandling: weak verify, alg=none, secrets in client bundle
            - CORS misconfiguration / overly-permissive origins
            - Missing authz or rate-limiting on sensitive or state-changing endpoints
            - Weak crypto, predictable randomness, missing TLS verification
            - Sensitive data in logs; missing input validation on external data
            - Path traversal, arbitrary file read/write
            - CI/CD risks: untrusted pull_request_target, script injection in
              GitHub Actions expressions

            For each finding, post an inline comment with:
              SEVERITY (CRITICAL | HIGH | MEDIUM | LOW), the vulnerability
              class, why it is exploitable, and a concrete fix.
            Prefer false-negative avoidance on CRITICAL/HIGH; suppress
            low-confidence MEDIUM/LOW noise. If the diff is clean, post a
            single top-level comment: "Security review: no findings."

            Use `mcp__github_inline_comment__create_inline_comment` for
            specific code issues. Use `gh pr comment` for the summary.
            Only post GitHub comments — do not submit review text as messages.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
