name: Migration dry-run vs prod schema

# transformate WI-2075 (under WI-1847): every PR applies the pending migration set
# against a schema-only snapshot of the REAL prod database (db/prod-snapshot/), so a
# migration that is green on CI's from-scratch 000 schema but fatal on prod (the
# 2026-07-18 migration-024 class, fixed reactively in #90/#91) fails the PR instead
# of sitting merged-but-undeployable in front of the deploy queue.
#
# Two steps in one job: the "real" step must PASS; the "selftest" step seeds a
# 024-shaped regression (db/ci/selftest_024_shape.sql) and must see the migrator
# ABORT — proof in every run's logs that the job still catches the incident class.
#
# Trust model (documented, per fleet review-gate doctrine): this gate defends against
# the ACCIDENTAL incident class (honest migration, drifted CI schema). On PR events the
# snapshot is restored from the BASE ref so a PR cannot self-attest its own migration
# as already-applied; a deliberately malicious PR author is outside this layer's threat
# model (on same-repo pull_request events the workflow file itself is PR-controlled) —
# that bar is CODEOWNERS/required-review territory, tracked as a follow-up under
# transformate WI-1847.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: migration-dryrun-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dryrun:
    name: Pending migrations vs prod snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      timescaledb:
        # Pinned to prod's captured extension/PG line (db/prod-snapshot/META.txt);
        # bump deliberately with each snapshot refresh, never float on latest.
        image: timescale/timescaledb:2.25.2-pg16
        env:
          POSTGRES_USER: arkon
          POSTGRES_PASSWORD: arkon
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PG_BASE_URL: postgresql://arkon:arkon@localhost:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Scan the PR'S OWN committed snapshot BEFORE the base-ref overlay (panel R2, opus):
      # refresh PRs are exactly the ones introducing new snapshot content — scanning after
      # the overlay would examine the base's old files and let an unsanitized refresh merge.
      - name: Secret/PII scan of the committed snapshot (schema gunzipped)
        run: |
          set -euo pipefail
          # fail CLOSED on missing/empty artifacts (panel R2, composer/grok: grep rc=2 on a
          # missing file must not read as "clean")
          test -s db/prod-snapshot/schema.sql.gz
          test -s db/prod-snapshot/seed.sql
          gunzip -c db/prod-snapshot/schema.sql.gz > /tmp/snapshot-schema.sql
          bad=0
          # value-shaped leaks, not identifiers: quoted email literals, long quoted hex/base64
          # blobs, and password-bearing DDL literals
          if grep -niE "'[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'" /tmp/snapshot-schema.sql db/prod-snapshot/seed.sql; then bad=1; fi
          if grep -nE "'[A-Za-z0-9+/=]{40,}'|'[0-9a-f]{40,}'" /tmp/snapshot-schema.sql db/prod-snapshot/seed.sql; then bad=1; fi
          if grep -niE "PASSWORD +'" /tmp/snapshot-schema.sql db/prod-snapshot/seed.sql; then bad=1; fi
          # common credential shapes (panel R3, grok: quoted-blob probes alone overclaim)
          if grep -nE "ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|xox[baprs]-|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|Bearer [A-Za-z0-9._-]{20,}|postgres(ql)?://[^[:space:]']+:[^[:space:]']+@" /tmp/snapshot-schema.sql db/prod-snapshot/seed.sql; then bad=1; fi
          # seed.sql STRICT line allowlist (panel R3, grok: INSERT-prefix checks alone let
          # UPDATE/ALTER/other statements or stray psql meta-commands through): every
          # non-comment, non-empty line must be one of the shapes pg_dump actually emits
          # for this two-table --column-inserts dump. This also rejects \! and any other
          # non-restrict meta-command by construction.
          if grep -nvE "^[[:space:]]*--|^[[:space:]]*$|^SET [a-z_]+ = |^SELECT pg_catalog\.set_config\('search_path'|^SELECT pg_catalog\.setval\('public\._migrations_id_seq'|^[\]restrict [A-Za-z0-9]+[[:space:]]*$|^[\]unrestrict [A-Za-z0-9]+[[:space:]]*$|^INSERT INTO public\._migrations |^INSERT INTO public\.tenants " db/prod-snapshot/seed.sql; then
            echo "seed.sql lines outside the strict allowlist (see above)"; bad=1
          fi
          # non-vacuous: require >=1 INSERT for EACH allowed table (panel R2, grok: a
          # COPY-format or truncated dump matching zero INSERT lines is a violation)
          if ! grep -qiE '^INSERT INTO public\._migrations' db/prod-snapshot/seed.sql; then echo "seed.sql has no _migrations INSERTs (COPY-format or truncated dump?)"; bad=1; fi
          if ! grep -qiE '^INSERT INTO public\.tenants' db/prod-snapshot/seed.sql; then echo "seed.sql has no tenants INSERTs (COPY-format or truncated dump?)"; bad=1; fi
          # schema stream: no psql meta-commands beyond pg_dump's own restrict pair
          if grep -n '^[\]' /tmp/snapshot-schema.sql | grep -vE ':[\](un)?restrict [A-Za-z0-9]+[[:space:]]*$'; then
            echo "schema.sql carries psql meta-commands beyond restrict/unrestrict"; bad=1
          fi
          if [ "$bad" -ne 0 ]; then
            echo "::error title=Snapshot sanitization violation::value-shaped secret/PII or out-of-scope data payload in db/prod-snapshot — see matches above and db/prod-snapshot/README.md"
            exit 1
          fi
          echo "snapshot scan clean: artifacts present; no value-shaped secrets/PII; seed INSERTs non-vacuously scoped to _migrations + tenants"

      # Overlay AFTER the scan. Three-way branch (panel R3, grok+composer reconciled):
      #   migrations+snapshot in ONE PR  -> REFUSE (gate self-poison: the snapshot could
      #                                     pre-attest exactly the migrations under test);
      #   snapshot-only PR (refresh)     -> dry-run the PR's OWN scanned snapshot (a
      #                                     base-overlay would leave refreshes untested
      #                                     until after merge — composer R3);
      #   migrations/code-only PR        -> overlay from base (PR cannot self-attest),
      #                                     failing CLOSED except verifiable bootstrap.
      - name: Use prod snapshot from the base ref (PRs cannot self-attest)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          BASE="${{ github.base_ref }}"
          git fetch --depth=1 origin "$BASE"
          changed="$(git diff --name-only "origin/$BASE" HEAD --)"
          snap="$(grep -c '^db/prod-snapshot/' <<<"$changed" || true)"
          mig="$(grep -c '^migrations/.*\.sql$' <<<"$changed" || true)"
          if [ "$snap" -gt 0 ] && [ "$mig" -gt 0 ]; then
            echo "::error title=Snapshot and migrations changed in one PR::a PR must not modify db/prod-snapshot/ and migrations/*.sql together (the snapshot could pre-attest the very migrations under test). Split the refresh into its own PR — see db/prod-snapshot/README.md."
            exit 1
          elif [ "$snap" -gt 0 ]; then
            echo "snapshot-refresh PR: dry-running against the PR's own (already-scanned) snapshot"
          elif git cat-file -e "origin/$BASE:db/prod-snapshot/seed.sql" 2>/dev/null; then
            git checkout "origin/$BASE" -- db/prod-snapshot/
            echo "dry-run seed restored from origin/$BASE (PR cannot self-attest applied migrations)"
          else
            echo "::warning::db/prod-snapshot absent on origin/$BASE — bootstrap PR runs against its own snapshot"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16

      - name: Install dependencies
        run: npm ci
        env:
          ARKON_NPM_TOKEN: ${{ secrets.ARKON_NPM_TOKEN }}

      - name: Dry-run pending migrations against prod schema snapshot
        run: bash scripts/ci/migration-dryrun.sh real

      - name: Regression self-test — seeded 024-shaped migration must abort
        run: bash scripts/ci/migration-dryrun.sh selftest
