name: Claude Code Review

# Code-QUALITY pass: correctness + efficiency + effectiveness. Security is owned
# by the separate Claude Security Review workflow. Advisory (non-blocking).
# $0 — OAuth subscription token. Actions SHA-pinned; Dependabot keeps current.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

# Concurrency is scoped so the action's OWN progress comment (an issue_comment
# event) cannot cancel the in-flight review it just started:
#  - pull_request: group per PR  -> a new push supersedes the stale run
#  - issue_comment: group per comment id -> each comment is isolated, so the
#    bot's "Claude Code is working…" comment lands in its own group and never
#    cancels the real @claude run.
concurrency:
  group: claude-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.comment.id }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '@claude') &&
       !startsWith(github.event.comment.user.login, 'claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@787c5a0ce96a9a6cfb050ea0c8f4c05f2447c251 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "*"
          track_progress: true
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number || github.event.issue.number }}

            You are a CODE-QUALITY reviewer focused on CORRECTNESS and
            EFFICIENCY. Security is handled by a separate reviewer — do NOT
            flag security issues here. Review the PR diff for high-signal
            issues only:

            CORRECTNESS
            - Logic errors, wrong conditionals, off-by-one
            - Unhandled edge cases (empty/null/undefined, boundary values)
            - Race conditions, incorrect async/await, unawaited promises
            - Wrong or missing error/failure-path handling (swallowed errors,
              unhandled rejections, missing rollback)

            EFFICIENCY
            - Algorithmic-complexity regressions (Big-O); nested loops over
              large inputs where a map/set would do
            - N+1 queries; redundant DB/network round-trips; missing batching
            - Blocking / synchronous work on async or hot paths
            - Inefficient data-structure choice; redundant recomputation that
              should be hoisted or memoized

            EFFECTIVENESS
            - Broken caller contracts: renamed/removed/retyped exports without
              updating call sites
            - Dead or unreachable code; needless abstraction / over-engineering
            - Missing test coverage on NEW logic (not pre-existing gaps)
            - Stale external-API usage — if the PR calls a library/SDK, verify
              method names against current docs (APIs get renamed)

            SKIP ENTIRELY: style, formatting, naming, import order, anything a
            linter catches, personal preference, and security (separate pass).

            SEVERITY: CRITICAL (crash / data loss / silent failure) · HIGH
            (logic error with real impact, >=2x perf regression, broken
            contract) · MEDIUM (edge case, redundant work, missing test on new
            logic) · LOW (only if a pattern repeats 3+ times).

            Inline-comment CRITICAL/HIGH and clear MEDIUM only. Post only if
            you would genuinely block the PR or it materially matters — no
            speculative nits, no low-confidence guesses. State the concrete
            impact and a fix for each. If the diff is clean, post one short
            top-level summary line and nothing else.

            Use `mcp__github_inline_comment__create_inline_comment` for
            specific code issues. Use `gh pr comment` for the top-level summary.
            Only post GitHub comments — don't submit review text as messages.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
